name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1 -Recurse) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Output "$($f.Name): $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Engine scripts are plain ASCII
        shell: powershell
        run: |
          $hit = Select-String -Path app\TurboOptimizer.ps1, app\TurboOptimizerWeb.ps1, install.ps1 -Pattern '[^\x00-\x7F]'
          if ($hit) { $hit | Select-Object -First 10 | ForEach-Object { Write-Output "$($_.Filename):$($_.LineNumber)" }; exit 1 }
      - name: Short installer copy matches
        shell: powershell
        run: |
          if ((Get-FileHash .\install.ps1).Hash -ne (Get-FileHash .\i.txt).Hash) { Write-Output 'i.txt must be an exact copy of install.ps1'; exit 1 }
      - name: Translations
        shell: powershell
        run: .\tests\validate-strings.ps1 -Candidate .\app\TurboUI_strings.json

      - name: BIOS guides
        shell: powershell
        run: .\tests\validate-guides.ps1 -Candidate .\app\bios-guides.json

  selftest:
    name: Dry-run self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine self-test (changes nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\app\TurboOptimizer.ps1 -SelfTest
      - name: BIOS and boot logic (recorded samples, no hardware)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\test-bios-parsers.ps1
      - name: Program removal and monitor logic (temporary files and registry key only)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .	ests	est-programs.ps1
      - name: Browser version API test (changes nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\app\TurboOptimizerWeb.ps1 -Test
      - name: Daily watch in dry-run (changes nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\app\TurboOptimizer.ps1 -Monitor -DryRun
