name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1 -Recurse) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Output "$($f.Name): $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Engine scripts are plain ASCII
        shell: powershell
        run: |
          $hit = Select-String -Path TurboOptimizer.ps1, TurboOptimizerWeb.ps1, install.ps1 -Pattern '[^\x00-\x7F]'
          if ($hit) { $hit | Select-Object -First 10 | ForEach-Object { Write-Output "$($_.Filename):$($_.LineNumber)" }; exit 1 }
      - name: Translations
        shell: powershell
        run: .\tests\validate-strings.ps1 -Candidate .\TurboUI_strings.json

  selftest:
    name: Dry-run self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine self-test (changes nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\TurboOptimizer.ps1 -SelfTest
      - name: Browser version API test (changes nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\TurboOptimizerWeb.ps1 -Test
      - name: Daily watch in dry-run (changes nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\TurboOptimizer.ps1 -Monitor -DryRun
