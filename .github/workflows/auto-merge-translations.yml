name: Auto-merge translations

# A pull request that changes ONLY app/TurboUI_strings.json is checked by the validation script
# and merged automatically when it passes. Anything that touches code is never merged here:
# it waits for the owner. The pull request's content is read as data and never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  translations:
    runs-on: windows-latest
    steps:
      - name: Check out the trusted main branch (not the pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Only the translations file changed?
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --name-only)
          echo "$files"
          if [ "$files" = "app/TurboUI_strings.json" ]; then echo "only=true" >> "$GITHUB_OUTPUT"; else echo "only=false" >> "$GITHUB_OUTPUT"; fi
      - name: Read the candidate file as data
        if: steps.scope.outputs.only == 'true'
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "pull/$PR/head:candidate"
          git show candidate:app/TurboUI_strings.json > "$RUNNER_TEMP/candidate.json"
          cp app/TurboUI_strings.json "$RUNNER_TEMP/reference.json"
      - name: Validate with the trusted script
        if: steps.scope.outputs.only == 'true'
        shell: powershell
        run: .\tests\validate-strings.ps1 -Candidate "$env:RUNNER_TEMP\candidate.json" -Reference "$env:RUNNER_TEMP\reference.json"
      - name: Merge
        if: steps.scope.outputs.only == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
