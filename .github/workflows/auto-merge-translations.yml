name: Auto-merge translations

# A pull request that changes ONLY the translations (app/TurboUI_strings.json) and/or the BIOS guides
# (app/bios-guides.json) is checked by the validation scripts and merged automatically when they pass.
# Anything that touches code is never merged here: it waits for the owner.
# The pull request's files are read as data and never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  translations:
    runs-on: windows-latest
    steps:
      - name: Check out the trusted main branch (not the pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Only data files changed?
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --name-only)
          echo "$files"
          only=true
          strings=false
          guides=false
          [ -z "$files" ] && only=false
          for f in $files; do
            case "$f" in
              app/TurboUI_strings.json) strings=true ;;
              app/bios-guides.json) guides=true ;;
              *) only=false ;;
            esac
          done
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "strings=$strings" >> "$GITHUB_OUTPUT"
          echo "guides=$guides" >> "$GITHUB_OUTPUT"
      - name: Read the candidate files as data
        if: steps.scope.outputs.only == 'true'
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "pull/$PR/head:candidate"
          if [ "${{ steps.scope.outputs.strings }}" = "true" ]; then
            git show candidate:app/TurboUI_strings.json > "$RUNNER_TEMP/candidate-strings.json"
            cp app/TurboUI_strings.json "$RUNNER_TEMP/reference-strings.json"
          fi
          if [ "${{ steps.scope.outputs.guides }}" = "true" ]; then
            git show candidate:app/bios-guides.json > "$RUNNER_TEMP/candidate-guides.json"
          fi
      - name: Validate the translations with the trusted script
        if: steps.scope.outputs.only == 'true' && steps.scope.outputs.strings == 'true'
        shell: powershell
        run: .\tests\validate-strings.ps1 -Candidate "$env:RUNNER_TEMP\candidate-strings.json" -Reference "$env:RUNNER_TEMP\reference-strings.json"
      - name: Validate the BIOS guides with the trusted script
        if: steps.scope.outputs.only == 'true' && steps.scope.outputs.guides == 'true'
        shell: powershell
        run: .\tests\validate-guides.ps1 -Candidate "$env:RUNNER_TEMP\candidate-guides.json"
      - name: Merge
        if: steps.scope.outputs.only == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
