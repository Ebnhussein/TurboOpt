name: Feature request
description: Suggest a new fix, check or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem should it solve
      description: Describe what goes wrong on your PC, not only the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
