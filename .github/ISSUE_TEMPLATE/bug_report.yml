name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: dropdown
    id: ui
    attributes:
      label: Which version of the tool
      options: [Console, Browser version, Window version]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 10 22H2, build 19045
    validations:
      required: true
  - type: dropdown
    id: dry
    attributes:
      label: Was Dry run on
      options: ['Yes', 'No']
  - type: textarea
    id: log
    attributes:
      label: Problems report
      description: Paste the relevant part of turbo_errors.log (open it from the tool). Remove anything private first.
      render: text
