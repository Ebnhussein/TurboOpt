<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Optimizer</title>
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --text:#17202e; --muted:#667085; --line:#e3e7ee; --accent:#2f6bff; --accent2:#e8f0ff;
  --side:#18212f; --side2:#222e41; --sidetext:#dfe6f2; --ok:#1b8a4b; --warn:#b36b00; --bad:#c62828; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141b; --panel:#171e28; --text:#e6ebf3; --muted:#93a0b4; --line:#263041; --accent:#5b8cff; --accent2:#1c2a46; --side:#0b1017; --side2:#16202e; --ok:#3fb950; --warn:#e3b341; --bad:#ff7b72; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Segoe UI Variable",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;min-height:56px;background:var(--side);color:#fff;flex:none}
.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;flex:1}
.top label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sidetext)}
.top select{background:var(--side2);color:#fff;border:1px solid #33425a;border-radius:8px;padding:8px 12px;font:inherit}
.sw{position:relative;width:38px;height:22px;background:#3a475c;border-radius:20px;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
input.swin{display:none}
input.swin:checked+.sw{background:#f0a020}
input.swin:checked+.sw::after{inset-inline-start:19px}
.main{flex:1;display:flex;min-height:0}
.side{width:220px;background:var(--side);padding:8px 10px;display:flex;flex-direction:column;gap:4px;flex:none;overflow:auto}
.side button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:11px 12px;color:var(--sidetext);text-align:start;font-size:14px}
.side button:hover:not(:disabled){background:var(--side2)}
.side button.on{background:var(--accent);color:#fff}
.side .ic{font-size:17px;width:22px;text-align:center}
.content{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 20px 0;gap:12px;overflow:hidden}
.pc{font-weight:600;font-size:14px}
.pc small{color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600;direction:ltr;unicode-bidi:plaintext;text-align:start}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid transparent;border-inline-start:4px solid var(--accent);border-radius:12px;padding:12px 14px;text-align:start;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);border-inline-start-color:var(--accent)}
.card b{display:block;font-size:14px;margin-bottom:2px}
.card span{color:var(--muted);font-size:12.5px;display:block}
.note{font-size:12px;color:var(--muted)}
.logwrap{flex:1;min-height:120px;display:flex;flex-direction:column}
#log{flex:1;overflow:auto;background:#0e1217;color:#cccccc;border-radius:12px 12px 0 0;padding:12px 14px;font:12.5px/1.45 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;unicode-bidi:plaintext}
.bar{flex:none;background:var(--panel);border-radius:0;padding:8px 20px 10px;margin:0 -20px;border-top:1px solid var(--line)}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.prog.ind i{width:35%;animation:ind 1.1s ease-in-out infinite alternate}
[dir=rtl] .prog.ind i{animation-name:indr}
@keyframes ind{from{margin-inline-start:0}to{margin-inline-start:65%}}
@keyframes indr{from{margin-inline-start:0}to{margin-inline-start:65%}}
.barrow{display:flex;align-items:center;gap:12px}
#status{flex:1;color:var(--muted);direction:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 16px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.veil{position:fixed;inset:0;background:rgba(8,12,20,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.veil.on{display:flex}
.modal{background:var(--panel);color:var(--text);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(860px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;position:relative}
.modal>div{display:flex;flex-direction:column;min-height:0;flex:1}
.xbtn{position:absolute;top:10px;inset-inline-end:12px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.xbtn:hover{background:var(--accent2);color:var(--text)}
.modal h2{padding-inline-end:56px}
.modal.sm{width:min(480px,100%)}
.modal h2{margin:0;padding:16px 20px 8px;font-size:17px}
.mbody{padding:6px 20px;overflow:auto;flex:1;min-height:0;white-space:pre-wrap}
.modal h2,.mfoot{flex:none}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;flex-wrap:wrap;align-items:center}
.mfoot .sp{flex:1}
.mbody input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;margin-top:10px;direction:ltr}
table.lst{width:100%;border-collapse:collapse;white-space:normal}
table.lst th{position:sticky;top:0;background:var(--panel);text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.lst td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.lst tr.row{cursor:pointer}
table.lst tr.row:hover td{background:var(--accent2)}
table.lst tr.sel td{background:var(--accent2)}
.sev{display:inline-block;border-radius:6px;padding:4px 12px;font-size:11.5px;font-weight:600}
.sev.HIGH{background:#fde7e7;color:#b3261e}.sev.MED{background:#fff1d6;color:#8a5600}.sev.INFO{background:#e8edf5;color:#475467}
@media (prefers-color-scheme:dark){.sev.HIGH{background:#4a1d1d;color:#ff9a93}.sev.MED{background:#4a3a14;color:#f0c35a}.sev.INFO{background:#263041;color:#aab6c8}}
.dtl{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:10px;min-height:64px;max-height:150px;overflow:auto;font-size:13px;direction:ltr;text-align:left;white-space:pre-wrap}
.radios label{display:flex;gap:10px;align-items:center;padding:8px 2px}
.tag{color:var(--muted);font-size:12px}
.toast{position:fixed;inset-inline-end:20px;bottom:90px;background:var(--bad);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20}
@media (max-width:760px){.side{width:64px}.side button span.t{display:none}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <h1 id="appName">Turbo Optimizer</h1>
  <label><input class="swin" type="checkbox" id="dry"><span class="sw"></span><span id="dryL"></span></label>
  <label><span id="langL"></span><select id="lang"></select></label>
</div>
<div class="main">
  <nav class="side" id="side"></nav>
  <section class="content">
    <div class="pc" id="pc"></div>
    <div class="stats" id="stats"></div>
    <div class="cards" id="cards"></div>
    <div class="note" id="note"></div>
    <div class="logwrap"><div id="log"></div></div>
    <div class="bar">
      <div class="prog" id="prog"><i></i></div>
      <div class="barrow"><div id="status"></div><button class="btn bad" id="stop" disabled></button></div>
    </div>
  </section>
</div>
<div class="veil" id="veil"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const BOOT = __BOOT__;
const TOKEN = BOOT.token;
const $ = id => document.getElementById(id);
let lang = BOOT.lang, cat = 'home', busy = false, since = 0, info = null, lastPromptId = 0, lastDialogId = 0, modalOpen = false, offline = 0;
const ICONS = {home:'\u{1F3E0}',clean:'\u{1F9F9}',speed:'⚡',update:'\u{1F504}',network:'\u{1F4F6}',security:'\u{1F6E1}️',safety:'\u{1F9F0}'};
const COLORS = {Black:'#cccccc',DarkBlue:'#5c8dff',DarkGreen:'#3fb950',DarkCyan:'#39c5cf',DarkRed:'#ff6b6b',DarkMagenta:'#d2a8ff',DarkYellow:'#d29922',Gray:'#cccccc',DarkGray:'#8b949e',Blue:'#79c0ff',Green:'#56d364',Cyan:'#56d4dd',Red:'#ff7b72',Magenta:'#d2a8ff',Yellow:'#e3b341',White:'#ffffff'};
function T(k){const l=BOOT.S[lang];if(l&&l[k]!==undefined)return l[k];return BOOT.S.en[k]!==undefined?BOOT.S.en[k]:k;}
function fmt(s,...a){return s.replace(/\{(\d+)\}/g,(m,i)=>a[i]);}
async function api(path,body){
  const opt={method:body===undefined?'GET':'POST',headers:{'X-Token':TOKEN}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  const r=await fetch(path,opt);
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e;}
  return r.json();
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4000);}
function el(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){if(k==='class')e.className=props[k];else if(k==='text')e.textContent=props[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),props[k]);else e.setAttribute(k,props[k]);}for(const c of kids)if(c)e.append(c);return e;}

// ---- layout / language
function applyLang(){
  const L=BOOT.S[lang];
  const rtl=L&&L._rtl==='1';
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.documentElement.lang=lang;
  document.title=T('app');
  $('appName').textContent=T('app');
  $('dryL').textContent=T('dry');
  $('langL').textContent=T('lang');
  $('note').textContent=T('note_log');
  $('stop').textContent=T('stop');
  const sel=$('lang');sel.innerHTML='';
  for(const code in BOOT.S){const o=el('option',{value:code,text:BOOT.S[code]._name});if(code===lang)o.selected=true;sel.append(o);}
  buildSide();buildStats();buildCards();renderInfo();setStatus();
}
function buildSide(){
  const s=$('side');s.innerHTML='';
  for(const c of BOOT.cats){
    const b=el('button',{class:c.id===cat?'on':''},el('span',{class:'ic',text:ICONS[c.id]||'•'}),el('span',{class:'t',text:T(c.k)}));
    b.disabled=busy;b.onclick=()=>{cat=c.id;buildSide();buildCards();};s.append(b);
  }
}
function buildStats(){
  const st=$('stats');st.innerHTML='';
  for(const [id,k] of [['sFree','stat_free'],['sRam','stat_ram'],['sStart','stat_startup'],['sHealth','stat_health']])
    st.append(el('div',{class:'stat'},el('div',{class:'l',text:T(k)}),el('div',{class:'v',id,text:'...'})));
}
function buildCards(){
  const w=$('cards');w.innerHTML='';
  const c=BOOT.cats.find(x=>x.id===cat);if(!c)return;
  for(const a of c.actions){
    const b=el('button',{class:'card'},el('b',{text:T(a.k)}),el('span',{text:T(a.d)}));
    b.disabled=busy;b.onclick=()=>runAction(a);w.append(b);
  }
}
function renderInfo(){
  const m=info;if(!m){$('pc').textContent=T('loading');return;}
  const kind=m.VM?'VM':(m.Laptop?'laptop':'desktop');
  $('pc').innerHTML='';
  $('pc').append(document.createTextNode((m.Vendor||'')+' '+(m.Model||'')),el('small',{text:'   |   '+(m.Caption||'')+' ('+m.Build+')   |   '+kind}));
  if($('sFree'))$('sFree').textContent=m.FreeGB+' GB';
  if($('sRam'))$('sRam').textContent=m.RamPct+' %';
  if($('sStart'))$('sStart').textContent=m.Startup;
  const h=$('sHealth');if(!h)return;
  h.className='v';
  if(m.High<0){h.textContent=T('stat_unknown');}
  else if(m.High===0&&m.Med===0){h.textContent=T('stat_ok');h.classList.add('ok');}
  else{h.textContent=fmt(T('stat_issues'),m.High,m.Med);h.classList.add(m.High>0?'bad':'warn');}
}
let work='',elapsed=0;
function setStatus(){
  $('status').textContent=busy?(work||T('working'))+'   ('+elapsed+' s)':T('ready');
  $('stop').disabled=!busy;
  $('prog').classList.toggle('ind',busy&&!stepN);
}
let stepN=0;
function setProgress(i,n){stepN=n;$('prog').firstElementChild.style.width=n?Math.max(0,Math.min(100,(i-1)/n*100))+'%':'';}

// ---- log
const logEl=$('log');let curLine=null;
function appendLog(items){
  const stick=logEl.scrollTop+logEl.clientHeight>=logEl.scrollHeight-40;
  const frag=document.createDocumentFragment();
  for(const e of items){
    if(e.k==='text'){
      const s=document.createElement('span');s.textContent=e.n?e.t:e.t+'\n';
      const c=COLORS[e.c];if(c)s.style.color=c;frag.append(s);
    }else if(e.k==='head'){const s=el('span',{text:'\n=== '+e.t+' ===\n'});s.style.color=COLORS.Cyan;frag.append(s);}
    else if(e.k==='done'){const s=el('span',{text:'--- '+T('msg_done')+'  ('+e.secs+' s)\n'});s.style.color=COLORS.DarkGray;frag.append(s);}
    else if(e.k==='stopped'){const s=el('span',{text:'--- '+T('msg_stopped')+'\n'});s.style.color=COLORS.Yellow;frag.append(s);}
  }
  logEl.append(frag);
  while(logEl.childNodes.length>6000)logEl.removeChild(logEl.firstChild);
  if(stick)logEl.scrollTop=logEl.scrollHeight;
}

// ---- modals
let modalCancel=null;
function showModal(node,small,cancel){const m=$('modal');m.innerHTML='';m.className='modal'+(small?' sm':'');m.append(node);modalCancel=cancel||null;if(cancel){const x=el('button',{class:'xbtn',text:'✕','aria-label':T('dlg_close')});x.onclick=cancel;m.append(x);}$('veil').classList.add('on');modalOpen=true;}
function hideModal(){$('veil').classList.remove('on');modalOpen=false;modalCancel=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalCancel)modalCancel();});
$('veil').addEventListener('mousedown',e=>{if(e.target===$('veil')&&modalCancel)modalCancel();});
function askModal(text,yesLabel,noLabel){
  return new Promise(res=>{
    const yes=el('button',{class:'btn pri',text:yesLabel||T('dlg_ok')}),no=el('button',{class:'btn',text:noLabel||T('dlg_cancel')});
    const box=el('div',null,el('div',{class:'mbody',text:text}),el('div',{class:'mfoot'},no,yes));
    yes.onclick=()=>{hideModal();res(true);};no.onclick=()=>{hideModal();res(false);};
    showModal(box,true,()=>no.click());yes.focus();
  });
}
function inputModal(text,def){
  return new Promise(res=>{
    const inp=el('input',{type:'text'});inp.value=def||'';
    const ok=el('button',{class:'btn pri',text:T('dlg_ok')}),cn=el('button',{class:'btn',text:T('dlg_cancel')});
    const box=el('div',null,el('div',{class:'mbody'},document.createTextNode(text),inp),el('div',{class:'mfoot'},cn,ok));
    ok.onclick=()=>{hideModal();res(inp.value);};cn.onclick=()=>{hideModal();res('');};
    inp.onkeydown=e=>{if(e.key==='Enter')ok.click();};
    showModal(box,true,()=>cn.click());inp.focus();inp.select();
  });
}
async function handlePrompt(p){
  lastPromptId=p.id;
  let v;
  if(p.k==='ask')v=await askModal(p.t);
  else if(p.mode==='all')v=(await askModal(T('msg_clean_all')))?'A':'';
  else v=await inputModal(p.t,p.def);
  try{await api('/api/answer',{id:p.id,value:v});}catch(e){toast(e.message);}
}
function findingsModal(d){
  const items=d.items||[];
  if(!items.length){hideModal();return;}
  const dtl=el('div',{class:'dtl',text:''});
  const tb=el('tbody');const checks=[];
  for(const f of items){
    const cb=el('input',{type:'checkbox'});if(f.Fix&&f.Sev!=='INFO')cb.checked=true;if(!f.Fix)cb.disabled=true;
    let fx=f.Fix?T('fix_'+f.Fix):T('fix_none');if(f.Download)fx+=' ('+f.Download+')';
    const tr=el('tr',{class:'row'},el('td',null,cb),el('td',null,el('span',{class:'sev '+f.Sev,text:T('sev_'+f.Sev)})),el('td',{text:f.Title}),el('td',{class:'tag',text:fx}));
    tr.onclick=ev=>{for(const r of tb.children)r.classList.remove('sel');tr.classList.add('sel');dtl.textContent=f.Detail||'';};
    tb.append(tr);checks.push([cb,f]);
  }
  const tbl=el('table',{class:'lst'},el('thead',null,el('tr',null,el('th'),el('th',{text:T('col_sev')}),el('th',{text:T('col_problem')}),el('th',{text:T('col_fix')}))),tb);
  const fix=el('button',{class:'btn pri',text:T('dlg_fix')}),ign=el('button',{class:'btn',text:T('dlg_ignore')}),cls=el('button',{class:'btn',text:T('dlg_close')});
  const send=async mode=>{
    const ids=checks.filter(c=>c[0].checked&&!c[0].disabled).map(c=>c[1].Id);
    hideModal();await closeDialog(d.id);
    if(ids.length)try{await api('/api/fix',{ids,mode});}catch(e){toast(e.message);}
  };
  fix.onclick=()=>send('Fix');ign.onclick=()=>send('Ignore');cls.onclick=async()=>{hideModal();await closeDialog(d.id);};
  showModal(el('div',null,el('h2',{text:T('dlg_findings')}),el('div',{class:'mbody'},tbl,dtl),el('div',{class:'mfoot'},cls,el('span',{class:'sp'}),ign,fix)),false,()=>cls.click());
}
function startupModal(d){
  const items=d.items||[];const tb=el('tbody');const checks=[];
  for(const s of items){
    const cb=el('input',{type:'checkbox'});if(s.Protected)cb.disabled=true;
    const name=s.Name+(s.Protected?'  ['+T('tag_protected')+']':'');
    tb.append(el('tr',{class:'row'},el('td',null,cb),el('td',{text:name,style:s.Protected?'color:var(--muted)':''}),el('td',{class:'tag',text:s.Command,style:'direction:ltr;text-align:left;word-break:break-all'})));
    checks.push([cb,s]);
  }
  const tbl=el('table',{class:'lst'},el('thead',null,el('tr',null,el('th'),el('th',{text:T('col_program')}),el('th',{text:T('col_command')}))),tb);
  const mins=el('input',{type:'number',min:'1',max:'30',value:'2',style:'width:64px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)'});
  const dis=el('button',{class:'btn pri',text:T('dlg_disable')}),del=el('button',{class:'btn',text:T('dlg_delay')}),cls=el('button',{class:'btn',text:T('dlg_close')});
  const send=async mode=>{
    const keys=checks.filter(c=>c[0].checked&&!c[0].disabled).map(c=>c[1].Key);
    hideModal();await closeDialog(d.id);
    if(keys.length)try{await api('/api/startup',{keys,mode,minutes:parseInt(mins.value)||2});}catch(e){toast(e.message);}
  };
  dis.onclick=()=>send('Disable');del.onclick=()=>send('Delay');cls.onclick=async()=>{hideModal();await closeDialog(d.id);};
  showModal(el('div',null,el('h2',{text:T('dlg_startup')}),el('div',{class:'mbody'},tbl),el('div',{class:'mfoot'},cls,el('span',{class:'sp'}),el('span',{class:'tag',text:T('dlg_minutes')}),mins,del,dis)),false,()=>cls.click());
}
async function closeDialog(id){try{await api('/api/dialog_close',{id});}catch(e){}}
function dnsModal(){
  const opts=['Cloudflare (1.1.1.1)','Google (8.8.8.8)','Quad9 (9.9.9.9)',T('dlg_auto')];
  const box=el('div',{class:'radios'});
  opts.forEach((o,i)=>{const r=el('input',{type:'radio',name:'dns',value:i});if(i===0)r.checked=true;box.append(el('label',null,r,document.createTextNode(o)));});
  const ok=el('button',{class:'btn pri',text:T('dlg_ok')}),cn=el('button',{class:'btn',text:T('dlg_cancel')});
  cn.onclick=hideModal;
  ok.onclick=async()=>{const pick=parseInt(box.querySelector('input:checked').value);hideModal();try{await api('/api/dns',{pick});}catch(e){toast(e.message);}};
  showModal(el('div',null,el('h2',{text:T('dlg_dns')}),el('div',{class:'mbody'},box),el('div',{class:'mfoot'},cn,ok)),true,()=>cn.click());
}

// ---- actions
async function runAction(a){
  if(busy||modalOpen)return;
  if(a.special==='dns'){dnsModal();return;}
  try{await api('/api/run',{id:a.k,dry:$('dry').checked,lang});}catch(e){toast(e.status===409?T('working'):e.message);}
  poll(true);
}
$('stop').onclick=async()=>{if(busy&&!modalOpen&&await askModal(T('msg_stop')))try{await api('/api/stop',{});}catch(e){toast(e.message);}};
$('lang').onchange=async e=>{lang=e.target.value;try{await api('/api/lang',{lang});}catch(x){}applyLang();};
window.addEventListener('pagehide',()=>{try{fetch('/api/bye',{method:'POST',keepalive:true,headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:'{}'});}catch(e){}});

// ---- polling
let polling=false;
async function poll(){
  if(polling)return;polling=true;
  try{
    const r=await api('/api/poll?since='+since);
    offline=0;since=r.next;
    if(r.events.length)appendLog(r.events);
    if(r.info){info=r.info;renderInfo();}
    const wasBusy=busy;busy=r.busy;work=r.work;elapsed=r.elapsed;
    if(r.step){setProgress(r.step.i,r.step.n);}else setProgress(0,0);
    if(wasBusy!==busy){buildSide();buildCards();}
    setStatus();
    if(r.prompt&&r.prompt.id!==lastPromptId&&!modalOpen)handlePrompt(r.prompt);
    if(r.dialog&&r.dialog.id!==lastDialogId&&!modalOpen){lastDialogId=r.dialog.id;if(r.dialog.k==='findings')findingsModal(r.dialog);else startupModal(r.dialog);}
  }catch(e){
    if(++offline===8)toast('Connection to the engine lost');
  }finally{polling=false;}
}
applyLang();
poll();
setInterval(poll,300);
</script>
