<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Optimizer</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#f0f3f9; --text:#141b2b; --muted:#5b6679; --line:#e1e6ef;
  --accent:#2b62f0; --accent-ink:#ffffff; --accent-soft:#e7eefe;
  --ok:#17803f; --ok-soft:#e2f5e9; --warn:#a15c00; --warn-soft:#fff0d3; --bad:#c42b2b; --bad-soft:#fde8e8;
  --side:#111827; --side-hover:#1c2638; --side-text:#d6deec; --side-muted:#8693a8;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
  --focus:0 0 0 3px rgba(43,98,240,.45);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1118; --surface:#151c27; --surface2:#1b2432; --text:#e8edf5; --muted:#9aa7bb; --line:#263243;
    --accent:#5b8cff; --accent-ink:#06122e; --accent-soft:#1a2a4d;
    --ok:#46c276; --ok-soft:#14301f; --warn:#e7b341; --warn-soft:#3a2f12; --bad:#ff7d75; --bad-soft:#40201f;
    --side:#080c12; --side-hover:#141c2a; --side-text:#d6deec; --side-muted:#7c8aa0;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.35);
    --focus:0 0 0 3px rgba(91,140,255,.55);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Segoe UI Variable",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] svg.flip{transform:scaleX(-1)}
* {scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;background:var(--side);color:#fff;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:.2px;flex:1;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b8cff,#2b62f0);display:grid;place-items:center;color:#fff}
.logo svg{width:18px;height:18px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--side-text);cursor:pointer;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:40px;height:24px;border-radius:24px;background:#3a475c;position:relative;transition:background .18s;flex:none}
.track::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .18s}
.switch input:checked+.track{background:#e7a423}
.switch input:checked+.track::after{inset-inline-start:19px}
.switch input:focus-visible+.track{box-shadow:var(--focus)}
.lang{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--side-text)}
.lang select{background:var(--side-hover);color:#fff;border:1px solid #2d3a50;border-radius:10px;padding:8px 10px;min-height:40px}
.banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);padding:8px 20px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;flex:none}
.banner.on{display:flex}

/* shell */
.shell{flex:1;display:flex;min-height:0}
.side{width:224px;background:var(--side);padding:10px;display:flex;flex-direction:column;gap:2px;flex:none;overflow:auto}
.nav{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:0 12px;min-height:44px;color:var(--side-text);text-align:start;font-size:14px;width:100%}
.nav:hover:not(:disabled){background:var(--side-hover)}
.nav[aria-current=page]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.side .spacer{flex:1}
.side .foot{color:var(--side-muted);font-size:12px;padding:10px 12px;line-height:1.4}
main{flex:1;min-width:0;overflow:auto;padding:22px 26px 28px;display:flex;flex-direction:column;gap:16px}
.wrap{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px}
#view:empty{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;transition:background .15s,border-color .15s,transform .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.big{min-height:52px;padding:0 24px;font-size:16px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft)}
.btn.icon{padding:0;width:44px}

/* hero */
.hero{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.ring svg{width:38px;height:38px;stroke-width:2}
.ring.ok{background:var(--ok-soft);color:var(--ok)}
.ring.warn{background:var(--warn-soft);color:var(--warn)}
.ring.bad{background:var(--bad-soft);color:var(--bad)}
.hero .txt{flex:1;min-width:240px}
.kicker{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.headline{font-size:24px;font-weight:700;line-height:1.25;margin:2px 0 6px}
.sub{color:var(--muted);max-width:56ch}
.cta{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.trust{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:2px}
.trust svg{width:16px;height:16px;color:var(--ok)}
.pcline{color:var(--muted);font-size:13px;direction:ltr;unicode-bidi:plaintext;text-align:start}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;direction:ltr;unicode-bidi:plaintext;text-align:start}
.meter{height:6px;border-radius:6px;background:var(--surface2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meter.warn i{background:var(--warn)}

/* sections and tiles */
.h2{font-size:15px;font-weight:700;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;align-items:flex-start;gap:12px;text-align:start;background:var(--surface);border:1px solid transparent;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:72px;width:100%}
.tile:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:14px}
.tile span.d{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.tile .go{margin-inline-start:auto;color:var(--muted);align-self:center}
.pagehead{display:flex;align-items:center;gap:10px}
.pagehead h1{font-size:22px;margin:0}

/* task panel */
.task{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:none;gap:14px;flex-direction:column;border-inline-start:4px solid var(--accent)}
.task.on{display:flex}
.task.done{border-inline-start-color:var(--ok)}
.task .row{display:flex;align-items:center;gap:12px}
.task .tt{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .st{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .25s}
.bar.ind i{width:35%;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-inline-start:0}to{margin-inline-start:65%}}
.okico{color:var(--ok)}

/* log */
.logbox{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.logbox>summary{list-style:none;cursor:pointer;padding:12px 18px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:44px}
.logbox>summary::-webkit-details-marker{display:none}
.logbox[open]>summary{border-bottom:1px solid var(--line)}
.lognote{padding:8px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
#log{max-height:42vh;overflow:auto;background:#0d1117;color:#ccc;padding:12px 16px;font:12.5px/1.45 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;unicode-bidi:plaintext}
#log:empty::before{content:"...";color:#667}

/* results panel */
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:clip}
.panel>header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel>header h1{font-size:19px;margin:0;flex:1}
.group{border-bottom:1px solid var(--line)}
.group:last-of-type{border-bottom:0}
.group>.gh{display:flex;align-items:center;gap:8px;padding:12px 20px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;padding:10px 20px}
.item:hover{background:var(--surface2)}
.item input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.item .main{min-width:0}
.item .title{font-weight:600;word-break:break-word;direction:ltr;unicode-bidi:plaintext;text-align:start}
.item .fixl{color:var(--muted);font-size:12.5px;text-align:end;max-width:220px}
.item .more{grid-column:2/4;color:var(--muted);font-size:13px;white-space:pre-wrap;word-break:break-word;direction:ltr;unicode-bidi:plaintext;text-align:start;margin-top:2px}
.item .tg{background:none;border:0;color:var(--accent);padding:0;font-size:13px;font-weight:600;min-height:28px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.badge.HIGH{background:var(--bad-soft);color:var(--bad)}
.badge.MED{background:var(--warn-soft);color:var(--warn)}
.badge.INFO{background:var(--surface2);color:var(--muted)}
.badge svg{width:13px;height:13px;stroke-width:2.4}
.stickybar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 16px -12px rgba(0,0,0,.25)}
.stickybar .sp{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 20px;text-align:center;color:var(--muted)}
.empty .ring{width:72px;height:72px}
table.lst{width:100%;border-collapse:collapse}
table.lst td{padding:10px 20px;border-top:1px solid var(--line);vertical-align:middle}
table.lst tr:hover td{background:var(--surface2)}
table.lst .cmd{color:var(--muted);font-size:12.5px;direction:ltr;unicode-bidi:plaintext;text-align:start;word-break:break-all}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.mcard .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mcard .v{font-size:26px;font-weight:700;direction:ltr;unicode-bidi:plaintext;text-align:start}
.mcard .s{font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:plaintext;text-align:start;min-height:19px}
.mcard svg.sp{width:100%;height:36px;margin-top:6px;display:block}
.mcard svg.sp polyline{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.mcard.warn svg.sp polyline{stroke:var(--warn)}
.mcard.bad svg.sp polyline{stroke:var(--bad)}
.m2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mpanel{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 0 8px;min-width:0}
.mpanel h3{margin:0;padding:12px 18px 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:13.5px}
.mrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:plaintext;text-align:start}
.mrow .n i{color:var(--muted);font-style:normal;font-size:12px;margin-inline-start:6px}
.mrow .x{font-weight:700;direction:ltr;unicode-bidi:plaintext}
.mrow .meter{flex:1;margin:0}
.mfoot{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:2px 4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1;min-width:160px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.hintline{padding:10px 20px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.pmeta{color:var(--muted);font-size:12.5px;direction:ltr;unicode-bidi:plaintext;text-align:start}
.ptag{display:inline-block;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;padding:1px 8px;margin-inline-start:6px}
.num{width:72px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}

/* modals */
.veil{position:fixed;inset:0;background:rgba(6,10,18,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.veil.on{display:flex}
.modal{background:var(--surface);color:var(--text);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.45);width:min(460px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;position:relative}
.modal h2{margin:0;padding:20px 24px 4px;font-size:17px;padding-inline-end:56px}
.modal .mb{padding:10px 24px;overflow:auto;min-height:0;white-space:pre-wrap}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 20px;flex-wrap:wrap}
.modal input[type=text]{width:100%;min-height:44px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;direction:ltr}
.xbtn{position:absolute;top:10px;inset-inline-end:10px;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center}
.xbtn:hover{background:var(--surface2);color:var(--text)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:8px;min-height:44px}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px}
.opt b{display:block}
.opt .od{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.modal .note{color:var(--muted);font-size:12.5px;padding:0 24px}
.radios label{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer}
.radios input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;inset-inline-end:20px;bottom:20px;background:var(--bad);color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:30;font-weight:600}
@media (max-width:820px){.mgrid{grid-template-columns:1fr 1fr}.m2{grid-template-columns:1fr}.side{width:64px}.nav span.t{display:none}.nav{justify-content:center;padding:0}.stats{grid-template-columns:1fr}.side .foot{display:none}main{padding:16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" id="logo"></span><span id="appName">Turbo Optimizer</span></div>
  <label class="lang"><span id="langL"></span><select id="lang" aria-label="Language"></select></label>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main">
    <div class="wrap">
      <section class="task" id="task" aria-live="polite"></section>
      <div id="view"></div>
      <details class="logbox" id="logbox"><summary id="logsum"></summary><div class="lognote" id="lognote"></div><div id="log" role="log"></div></details>
    </div>
  </main>
</div>
<div class="veil" id="veil"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="alert"></div>
<script>
"use strict";
const BOOT = __BOOT__;
const TOKEN = BOOT.token;
const $ = id => document.getElementById(id);
let lang = BOOT.lang, cat = 'home', view = 'home', busy = false, since = 0, info = null, lastPromptId = 0, lastDialogId = 0, modalOpen = false, offline = 0;
let infoJson = '', taskKey = '', results = null, startup = null, task = {state:'idle', title:'', secs:0}, work = '', elapsed = 0, stepI = 0, stepN = 0, selected = new Set(), expanded = new Set(), showInfo = false, programs = null, pFilter = '', pSort = 'size', monData = null, monHist = {cpu:[],ram:[],disk:[],net:[]};
const P = {
  home:'M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6', clean:'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z',
  speed:'M13 2L4 14h7l-1 8 9-12h-7z', update:'M21 12a9 9 0 1 1-3-6.7M21 3v6h-6', network:'M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M12 20h.01',
  security:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', safety:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 12m-3.5 0a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9',
  check:'M5 12l5 5 9-10', alert:'M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', x:'M6 6l12 12M18 6L6 18',
  chev:'M9 6l6 6-6 6', stop:'M7 7h10v10H7z', search:'M11 11m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0M21 21l-4.3-4.3', activity:'M3 12h4l2-5 4 10 2-5h6',
  info:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 8h.01M11 12h1v5h1', lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3', file:'M6 3h9l4 4v14H6zM14 3v5h5',
  trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13', play:'M8 5l11 7-11 7z', disk:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0', pie:'M21 12A9 9 0 1 1 12 3v9z',
  monitor:'M3 12h4l2-6 4 12 2-6h6', sliders:'M4 7h9M17 7h3M4 17h3M11 17h9M13 5v4M7 15v4', back:'M15 6l-6 6 6 6', wrench:'M14.7 6.3a4 4 0 0 0 5 5L21 12.6 12.6 21 3 11.4 11.4 3z'

  return '<svg class="sp" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+d+'"/></svg>';

  }
  const two=el('div',{class:'m2'});
  const top=(title,list,byRam)=>{ const p=el('div',{class:'mpanel'},el('h3',{text:title}));
    for(const r of list) p.append(el('div',{class:'mrow'},el('span',{class:'n',text:r.Name},r.N>1?el('i',{text:'\u00d7'+r.N}):null),el('span',{class:'x',text:byRam?fmtMB(r.MemMB):r.Cpu+' %'})));
    return p; };
  two.append(top(T('mon_top_cpu'),m.TopCpu||[],false),top(T('mon_top_ram'),m.TopRam||[],true)); v.append(two);
  const up=m.UptimeSec||0, ft=el('div',{class:'mfoot'});
  ft.append(el('span',{text:fmt(T('mon_uptime'),Math.floor(up/86400),Math.floor(up%86400/3600),Math.floor(up%3600/60))}),el('span',{text:fmt(T('mon_procs'),m.Procs)}));
  if(m.TempC!=null) ft.append(el('span',{text:fmt(T('mon_temp'),m.TempC)}));
  if(m.Battery!=null) ft.append(el('span',{text:fmt(T('mon_battery'),m.Battery)+(m.Charging?'  ('+T('mon_charging')+')':'')}));
  v.append(ft, el('div',{class:'mfoot',text:T('mon_note')}));
}
let monBusy=false;
async function monTick(){
  if(view!=='monitor'||monBusy) return; monBusy=true;
  try{
    const r=await api('/api/monitor');
    if(r.m){
      monData=r.m;
      const push=(a,x)=>{ a.push(x||0); if(a.length>60) a.shift(); };
      push(monHist.cpu,r.m.Cpu); push(monHist.ram,r.m.RamPct); push(monHist.disk,r.m.DiskPct); push(monHist.net,(r.m.NetDownKB||0)+(r.m.NetUpKB||0));
      if(view==='monitor') render();
    }
  }catch(e){} finally{ monBusy=false; }
}
setInterval(monTick,2500);

// ---------------------------------------------------------------- task panel and log
function renderTask(){
  const t=$('task'); const key=task.state+'|'+task.title+'|'+(task.state==='done'?task.secs:'')+'|'+lang;
  if(key!==taskKey){
    taskKey=key; t.className='task'+(task.state!=='idle'?' on':'')+(task.state==='done'?' done':''); t.innerHTML='';
    if(task.state==='run'){
      const row=el('div',{class:'row'},el('span',{class:'spin','aria-hidden':'true'}),el('span',{class:'tt',text:task.title||T('working')}));
      const stop=el('button',{class:'btn danger',html:icon('stop')+'<span></span>'}); stop.querySelector('span').textContent=T('stop'); stop.onclick=stopTask; row.append(stop);
      t.append(row,el('div',{class:'st',id:'tst'}),el('div',{class:'bar',id:'tbar'},el('i')));
    } else if(task.state==='done'){
      const row=el('div',{class:'row'},el('span',{class:'okico',html:icon('check')}),el('span',{class:'tt',text:(task.title?task.title+': ':'')+T('msg_done')+'  ('+task.secs+' s)'}));
      const x=el('button',{class:'btn icon ghost','aria-label':T('dlg_close'),html:icon('x')}); x.onclick=()=>{task.state='idle';renderTask();}; row.append(x); t.append(row);
    }
  }
  if(task.state==='run'){
    const st=$('tst'); if(st) st.textContent=(work||T('working'))+'   ('+elapsed+' s)';
    const bar=$('tbar'); if(bar){ bar.classList.toggle('ind',!stepN); bar.firstElementChild.style.width=stepN?Math.max(2,Math.min(100,(stepI-1)/stepN*100))+'%':''; }
  }
}
async function stopTask(){ if(busy&&!modalOpen&&await askModal(T('msg_stop'))) try{ await api('/api/stop',{}); }catch(e){toast(e.message);} }
const logEl=$('log');
function appendLog(items){
  const stick=logEl.scrollTop+logEl.clientHeight>=logEl.scrollHeight-40; const frag=document.createDocumentFragment();
  for(const e of items){
    if(e.k==='text'){const s=document.createElement('span'); s.textContent=e.n?e.t:e.t+'\n'; const c=COLORS[e.c]; if(c)s.style.color=c; frag.append(s);}
    else if(e.k==='head'){const s=el('span',{text:'\n=== '+e.t+' ===\n'}); s.style.color=COLORS.Cyan; frag.append(s); task={state:'run',title:e.t,secs:0}; }
    else if(e.k==='done'){const s=el('span',{text:'--- '+T('msg_done')+'  ('+e.secs+' s)\n'}); s.style.color=COLORS.DarkGray; frag.append(s); task={state:'done',title:task.title,secs:e.secs}; }
    else if(e.k==='stopped'){const s=el('span',{text:'--- '+T('msg_stopped')+'\n'}); s.style.color=COLORS.Yellow; frag.append(s);}
  }
  logEl.append(frag); while(logEl.childNodes.length>6000) logEl.removeChild(logEl.firstChild);
  if(stick) logEl.scrollTop=logEl.scrollHeight;
}

// ---------------------------------------------------------------- modals
let modalCancel=null, lastFocus=null;
function showModal(node,cancel){
  const m=$('modal'); m.innerHTML=''; m.append(node); modalCancel=cancel||null; lastFocus=document.activeElement;
  if(cancel){const x=el('button',{class:'xbtn','aria-label':T('dlg_close'),html:icon('x')}); x.onclick=cancel; m.append(x);}
  $('veil').classList.add('on'); modalOpen=true;
}
function hideModal(){ $('veil').classList.remove('on'); modalOpen=false; modalCancel=null; if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(e){} }
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(modalCancel) modalCancel(); else if(view==='results'||view==='startup'||view==='programs') closeDialog();
});
$('veil').addEventListener('mousedown',e=>{ if(e.target===$('veil')&&modalCancel) modalCancel(); });
function askModal(text,yesLabel,noLabel){
  return new Promise(res=>{
    const yes=el('button',{class:'btn primary',text:yesLabel||T('dlg_ok')}), no=el('button',{class:'btn',text:noLabel||T('dlg_cancel')});
    const box=el('div',null,el('div',{class:'mb',text:text}),el('div',{class:'mf'},no,yes));
    yes.onclick=()=>{hideModal();res(true);}; no.onclick=()=>{hideModal();res(false);};
    showModal(box,()=>no.click()); yes.focus();
  });
}
function inputModal(text,def){
  return new Promise(res=>{
    const inp=el('input',{type:'text'}); inp.value=def||'';
    const ok=el('button',{class:'btn primary',text:T('dlg_ok')}), cn=el('button',{class:'btn',text:T('dlg_cancel')});
    const box=el('div',null,el('div',{class:'mb'},document.createTextNode(text),inp),el('div',{class:'mf'},cn,ok));
    ok.onclick=()=>{hideModal();res(inp.value);}; cn.onclick=()=>{hideModal();res('');};
    inp.onkeydown=e=>{ if(e.key==='Enter') ok.click(); };
    showModal(box,()=>cn.click()); inp.focus(); inp.select();
  });
}
async function handlePrompt(p){
  lastPromptId=p.id; let v;
  if(p.k==='ask') v=await askModal(trPrompt(p.t));
  else if(p.mode==='all') v=(await askModal(T('msg_clean_all')))?'A':'';
  else v=await inputModal(p.t,p.def);
  try{ await api('/api/answer',{id:p.id,value:v}); }catch(e){ toast(e.message); }
}
function aboutModal(){
  const link=el('a',{href:'https://github.com/Ebnhussein/TurboOpt',target:'_blank',rel:'noopener',text:'github.com/Ebnhussein/TurboOpt'}); link.style.cssText='color:var(--accent);direction:ltr;unicode-bidi:plaintext';
  const by=el('a',{href:'https://github.com/Ebnhussein',target:'_blank',rel:'noopener',text:'Ebnhussein'}); by.style.cssText='color:var(--accent)';
  const close=el('button',{class:'btn primary',text:T('dlg_close')});
  const box=el('div',null,el('h2',{text:T('app')}),
    el('div',{class:'mb',style:'white-space:normal;display:flex;flex-direction:column;gap:8px'},
      el('div',{text:T('about_desc')}),
      el('div',{text:fmt(T('about_ver'),BOOT.version||'')}),
      el('div',null,document.createTextNode(T('about_by')+' '),by),
      el('div',null,document.createTextNode(T('about_site')+': '),link),
      el('div',{style:'color:var(--muted);font-size:13px',text:T('about_privacy')}),
      el('div',{style:'color:var(--muted);font-size:13px',text:T('about_license')})),
    el('div',{class:'mf'},close));
  close.onclick=hideModal; showModal(box,hideModal); close.focus();
}
async function autoModal(first){
  let cur='off'; try{ const r=await api('/api/auto'); cur=r.mode; }catch(e){}
  const opts=[['off','auto_off','auto_off_d'],['weekly','auto_weekly','auto_weekly_d'],['monitor','auto_monitor','auto_monitor_d']];
  const box=el('div');
  for(const [v,t,d] of opts){
    const r=el('input',{type:'radio',name:'auto',value:v}); if(v===cur) r.checked=true;
    const txt=el('span',null,el('b',{text:T(t)}),el('span',{class:'od',text:T(d)}));
    box.append(el('label',{class:'opt'},r,txt));
  }
  const ok=el('button',{class:'btn primary',text:T('auto_save')}), cn=el('button',{class:'btn',text:T('dlg_cancel')});
  const leave=async()=>{ hideModal(); if(first){ try{ await api('/api/auto',{mode:'skip'}); }catch(e){} } };
  cn.onclick=leave;
  ok.onclick=async()=>{ const mode=box.querySelector('input:checked').value; hideModal(); try{ await api('/api/auto',{mode}); }catch(e){ toast(e.status===409?T('working'):e.message); } poll(); };
  showModal(el('div',null,el('h2',{text:first?T('auto_q'):T('act_auto')}),el('div',{class:'mb'},box),el('div',{class:'note',text:T('auto_note')}),el('div',{class:'mf'},cn,ok)),leave);
  ok.focus();
}
function dnsModal(){
  const opts=['Cloudflare (1.1.1.1)','Google (8.8.8.8)','Quad9 (9.9.9.9)',T('dlg_auto')];
  const box=el('div',{class:'radios'});
  opts.forEach((o,i)=>{const r=el('input',{type:'radio',name:'dns',value:i}); if(i===0) r.checked=true; box.append(el('label',null,r,document.createTextNode(o)));});
  const ok=el('button',{class:'btn primary',text:T('dlg_ok')}), cn=el('button',{class:'btn',text:T('dlg_cancel')});
  cn.onclick=hideModal;
  ok.onclick=async()=>{ const pick=parseInt(box.querySelector('input:checked').value); hideModal(); try{ await api('/api/dns',{pick}); }catch(e){ toast(e.message); } };
  showModal(el('div',null,el('h2',{text:T('dlg_dns')}),el('div',{class:'mb'},box),el('div',{class:'mf'},cn,ok)),()=>cn.click());
}

// ---------------------------------------------------------------- actions and polling
async function runAction(a){
  if(busy||modalOpen) return;
  if(a.special==='dns'){ dnsModal(); return; }
  if(a.special==='auto'){ autoModal(false); return; }
  try{ await api('/api/run',{id:a.k,lang}); }catch(e){ toast(e.status===409?T('working'):e.message); }
  poll();
}
$('lang').onchange=async e=>{ lang=e.target.value; try{ await api('/api/lang',{lang}); }catch(x){} applyLang(); };
window.addEventListener('pagehide',()=>{ try{ fetch('/api/bye',{method:'POST',keepalive:true,headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:'{}'}); }catch(e){} });
let polling=false;
async function poll(){
  if(polling) return; polling=true;
  try{
    const r=await api('/api/poll?since='+since);
    offline=0; since=r.next;
    if(r.events.length) appendLog(r.events);
    if(r.info){ if(DEMO){ r.info.Vendor='Example'; r.info.Model='Laptop 15'; } const js=JSON.stringify(r.info); if(js!==infoJson){ infoJson=js; info=r.info; if(view==='home') render(); } }
    const was=busy; busy=r.busy; work=r.work; elapsed=r.elapsed;
    if(r.step){ stepI=r.step.i; stepN=r.step.n; } else { stepI=0; stepN=0; }
    if(busy&&task.state!=='run') task={state:'run',title:task.title||'',secs:0};
    if(was!==busy){ buildSide(); render(); }
    renderTask();
    if(r.prompt&&r.prompt.id!==lastPromptId&&!modalOpen) handlePrompt(r.prompt);
    if(r.dialog&&r.dialog.id!==lastDialogId&&!modalOpen){ lastDialogId=r.dialog.id; if(r.dialog.k==='findings') openResults(r.dialog); else if(r.dialog.k==='programs') openPrograms(r.dialog); else openStartup(r.dialog); }
  }catch(e){ if(++offline===8) toast(T('lost')); }
  finally{ polling=false; }
}
// documentation screenshots: open the page with #demo (sample results) or #demo-home (generic device name)
const DEMO=location.hash.indexOf('#demo')===0;
if(location.hash==='#demo') setTimeout(()=>openResults({id:-1,k:'findings',items:[
  {Id:'d1',Sev:'HIGH',Title:'System drive is almost full (7 GB free, 6 percent)',Detail:'Free space on C: is low. Clean files and free up space.',Fix:'Clean'},
  {Id:'d2',Sev:'HIGH',Title:'Windows update(s) waiting: 2',Detail:'Updates are available and not installed yet.',Fix:'InstallWU'},
  {Id:'d3',Sev:'MED',Title:'Device problem: Example USB Device',Detail:'Windows reports an error code for this device.',Fix:'ScanDevices'},
  {Id:'d4',Sev:'MED',Title:'User Account Control (UAC) is turned off',Detail:'Programs can change the system without asking.',Fix:'UacOn'},
  {Id:'d5',Sev:'MED',Title:'The PC shut down without a clean shutdown',Detail:'A previous shutdown was not clean.',Fix:''},
  {Id:'d6',Sev:'INFO',Title:'Recurring error: Example-Service (ID 1000) x4',Detail:'The event log shows a repeating error.',Fix:''}]}),1500);
applyLang(); poll(); setInterval(poll,300);
if(!DEMO) setTimeout(async()=>{ try{ const r=await api('/api/auto'); if(!r.asked&&!modalOpen) autoModal(true); }catch(e){} },1800);
</script>
